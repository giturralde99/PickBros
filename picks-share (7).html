function formatName(n) {
  return n.replace(/\./g, ' ').replace(/\w/g, l => l.toUpperCase());
}

function calcResult(ph, pa, rh, ra) {
  if (ph === rh && pa === ra) return 'exact';
  const rw = rh > ra ? 1 : ra > rh ? -1 : 0;
  const pw = ph > pa ? 1 : pa > ph ? -1 : 0;
  return rw === pw ? 'winner' : 'wrong';
}

async function loadPicks() {
  const matchId = parseInt(document.getElementById('match-input').value);
  if (!matchId || matchId < 1 || matchId > 132) {
    document.getElementById('content-picks').innerHTML = '<div class="msg">Ingresa un número de partido válido</div>';
    return;
  }

  document.getElementById('content-picks').innerHTML = '<div class="msg">Cargando picks...</div>';
  document.getElementById('hint').style.display = 'none';

  try {
    const match = MATCHES.find(m => m.id === matchId);

    const [predsRes, resultRes, lbRes, elimRes] = await Promise.all([
      sb.from('match_predictions').select('user_id,home_score,away_score').eq('match_id', matchId),
      sb.from('match_results').select('home_score,away_score').eq('match_id', matchId).maybeSingle(),
      sb.from('leaderboard').select('user_id,display_name'),
      matchId >= 101 ? sb.from('elimination_matches').select('*').eq('id', matchId).maybeSingle() : Promise.resolve({data:null})
    ]);

    // If elimination match, build match object from DB
    if (matchId >= 101 && elimRes.data) {
      const e = elimRes.data;
      const elimMatch = {
        id: matchId,
        group: e.round || '16avos',
        home: e.home_team || 'Por definir',
        away: e.away_team || 'Por definir',
        hf: e.home_flag || '🏳️',
        af: e.away_flag || '🏳️',
        date: e.match_date || 'Por definir'
      };
      // Inject into MATCHES array temporarily
      if (!MATCHES.find(m => m.id === matchId)) {
        MATCHES.push(elimMatch);
      } else {
        const idx = MATCHES.findIndex(m => m.id === matchId);
        MATCHES[idx] = elimMatch;
      }
    }

    const preds = predsRes.data || [];
    const result = resultRes.data;
    const lb = lbRes.data || [];

    const nameMap = {};
    lb.forEach(u => { nameMap[u.user_id] = u.display_name; });

    const predMap = {};
    preds.forEach(p => { predMap[p.user_id] = p; });

    // All users from leaderboard
    const allUsers = lb.map(u => u.user_id);

    const rows = allUsers.map(uid => {
      const name = formatName(nameMap[uid] || uid.substring(0,8));
      const pred = predMap[uid];
      if (!pred) return { name, cls:'nopick', score:'? — ?', badge:'— Sin pick' };
      const ph = pred.home_score, pa = pred.away_score;
      if (!result) return { name, cls:'pending', score:`${ph} — ${pa}`, badge:'? Pendiente' };
      const r = calcResult(ph, pa, result.home_score, result.away_score);
      const badges = { exact:'🎯 Exacto +3pts', winner:'✓ Ganador +1pt', wrong:'✗ Fallo +0pts' };
      return { name, cls:r, score:`${ph} — ${pa}`, badge:badges[r] };
    }).sort((a,b) => {
      const o = {exact:0,winner:1,wrong:2,pending:3,nopick:4};
      return (o[a.cls]||4)-(o[b.cls]||4);
    });

    const matchMeta = match ? `GRUPO ${match.group} · ${match.date}` : `Partido ${matchId}`;
    const resultScore = result ? `${result.home_score} — ${result.away_score}` : '? — ?';
    const resultLabel = result ? 'RESULTADO FINAL' : 'EN CURSO / PENDIENTE';

    const matchBox = match ? `
      <div class="match-box">
        <div class="match-meta">${matchMeta}</div>
        <div class="match-teams">
          <div class="team"><span class="flag">${match.hf}</span><span class="team-name">${match.home}</span></div>
          <div><div class="score">${resultScore}</div><div class="result-label">${resultLabel}</div></div>
          <div class="team"><span class="team-name">${match.away}</span><span class="flag">${match.af}</span></div>
        </div>
      </div>` : `<div class="match-box"><div class="score">${resultScore}</div><div class="result-label">${resultLabel}</div></div>`;

    const rowsHtml = rows.map(r => `
      <div class="pick-row ${r.cls}">
        <div class="avatar">${r.name.charAt(0)}</div>
        <span class="pick-name">${r.name}</span>
        <span class="pick-score">${r.score}</span>
        <span class="pick-badge">${r.badge}</span>
      </div>`).join('');

    document.getElementById('content-picks').innerHTML = `
      <div class="card">
        <div class="card-header">
          <div class="card-logo">PICK<span>BROS</span></div>
          <span style="font-size:10px;color:rgba(255,255,255,0.3);letter-spacing:1px;text-transform:uppercase">Copa del Mundo 2026</span>
        </div>
        ${matchBox}
        <div class="section-label">Pronósticos de los participantes</div>
        <div class="picks-list">${rowsHtml}</div>
        <div class="card-footer">
          <span class="footer-url">pickbros.mx</span>
          <div class="footer-legend">
            <span style="font-size:10px;color:rgba(0,230,118,0.7)">🎯 +3pts</span>
            <span style="font-size:10px;color:rgba(255,200,0,0.7)">✓ +1pt</span>
            <span style="font-size:10px;color:rgba(255,80,80,0.7)">✗ +0pts</span>
          </div>
        </div>
      </div>`;

    document.getElementById('hint').style.display = 'block';

    // Build stats
    const homeWins = rows.filter(r => {
      if (!r.score || r.score === '? — ?') return false;
      const parts = r.score.split(' — ');
      return parseInt(parts[0]) > parseInt(parts[1]);
    }).length;
    const draws = rows.filter(r => {
      if (!r.score || r.score === '? — ?') return false;
      const parts = r.score.split(' — ');
      return parseInt(parts[0]) === parseInt(parts[1]);
    }).length;
    const awayWins = rows.filter(r => {
      if (!r.score || r.score === '? — ?') return false;
      const parts = r.score.split(' — ');
      return parseInt(parts[0]) < parseInt(parts[1]);
    }).length;

    // Count score frequencies
    const scoreCount = {};
    rows.forEach(r => {
      if (r.score && r.score !== '? — ?') {
        scoreCount[r.score] = (scoreCount[r.score] || 0) + 1;
      }
    });
    const scoreEntries = Object.entries(scoreCount).sort((a,b) => b[1]-a[1]);
    const mostCommon = scoreEntries[0];
    const leastCommon = scoreEntries[scoreEntries.length-1];

    const matchName2 = match ? match.home + ' vs ' + match.away : 'Partido ' + matchId;

    document.getElementById('content-stats').innerHTML = `
      <div class="card">
        <div class="card-header">
          <div class="card-logo">PICK<span>BROS</span></div>
          <span style="font-size:10px;color:rgba(255,255,255,0.3);letter-spacing:1px;text-transform:uppercase">Stats</span>
        </div>
        ${matchBox}
        <div class="section-label" style="margin-bottom:12px">Tendencias del grupo</div>
        
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px">
          <div style="background:rgba(0,230,118,0.06);border:0.5px solid rgba(0,230,118,0.2);border-radius:12px;padding:14px;text-align:center">
            <div style="font-size:10px;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">${match ? match.home : 'Local'}</div>
            <div style="font-size:28px;font-weight:800;color:#00E676">${homeWins}</div>
            <div style="font-size:10px;color:rgba(255,255,255,0.3);margin-top:4px">ganan</div>
          </div>
          <div style="background:rgba(255,200,0,0.05);border:0.5px solid rgba(255,200,0,0.2);border-radius:12px;padding:14px;text-align:center">
            <div style="font-size:10px;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Empate</div>
            <div style="font-size:28px;font-weight:800;color:#FFC800">${draws}</div>
            <div style="font-size:10px;color:rgba(255,255,255,0.3);margin-top:4px">empatan</div>
          </div>
          <div style="background:rgba(100,150,255,0.05);border:0.5px solid rgba(100,150,255,0.2);border-radius:12px;padding:14px;text-align:center">
            <div style="font-size:10px;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">${match ? match.away : 'Visitante'}</div>
            <div style="font-size:28px;font-weight:800;color:#5AABFF">${awayWins}</div>
            <div style="font-size:10px;color:rgba(255,255,255,0.3);margin-top:4px">ganan</div>
          </div>
        </div>

        ${mostCommon ? `
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px">
          <div style="background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.09);border-radius:12px;padding:14px;display:flex;align-items:center;justify-content:space-between">
            <div>
              <div style="font-size:10px;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">🔥 Marcador más repetido</div>
              <div style="font-size:22px;font-weight:800;color:#fff">${mostCommon[0]}</div>
            </div>
            <div style="background:rgba(0,230,118,0.15);color:#00E676;font-size:13px;font-weight:800;padding:6px 14px;border-radius:100px">${mostCommon[1]} picks</div>
          </div>
          ${leastCommon && leastCommon[0] !== mostCommon[0] ? `
          <div style="background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.09);border-radius:12px;padding:14px;display:flex;align-items:center;justify-content:space-between">
            <div>
              <div style="font-size:10px;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">🎲 Marcador más arriesgado</div>
              <div style="font-size:22px;font-weight:800;color:#fff">${leastCommon[0]}</div>
            </div>
            <div style="background:rgba(255,80,80,0.12);color:rgba(255,120,120,0.9);font-size:13px;font-weight:800;padding:6px 14px;border-radius:100px">${leastCommon[1]} pick</div>
          </div>` : ''}
        </div>` : ''}

        <div class="section-label" style="margin-top:16px;margin-bottom:10px">🎯 Escenarios posibles</div>
        <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:14px">
          ${(function(){
            var allPreds = rows.filter(function(r){ return r.score && r.score !== '? — ?'; });
            var uniqueScores = [];
            var seen = {};
            allPreds.forEach(function(r){ if(!seen[r.score]){ seen[r.score]=1; uniqueScores.push(r.score); }});
            
            var scenarios = uniqueScores.map(function(sc){
              var parts = sc.split(' — ');
              var sh = parseInt(parts[0]), sa = parseInt(parts[1]);
              var sw = sh > sa ? 1 : sa > sh ? -1 : 0;
              var exact = 0, winner = 0, lose = 0;
              allPreds.forEach(function(r){
                var pp = r.score.split(' — ');
                var ph = parseInt(pp[0]), pa = parseInt(pp[1]);
                var pw = ph > pa ? 1 : pa > ph ? -1 : 0;
                if (ph === sh && pa === sa) exact++;
                else if (pw === sw) winner++;
                else lose++;
              });
              return { score:sc, exact:exact, winner:winner, lose:lose };
            }).sort(function(a,b){ return a.exact - b.exact; });

            return scenarios.map(function(s){
              return '<div style="background:rgba(255,255,255,0.03);border:0.5px solid rgba(255,255,255,0.08);border-radius:10px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between">' +
                '<span style="font-size:15px;font-weight:800;color:#fff;width:55px">' + s.score + '</span>' +
                '<div style="display:flex;gap:6px">' +
                  '<span style="font-size:10px;padding:3px 8px;border-radius:100px;font-weight:700;background:rgba(0,230,118,0.15);color:#00E676">🎯 ' + s.exact + ' exacto</span>' +
                  '<span style="font-size:10px;padding:3px 8px;border-radius:100px;font-weight:700;background:rgba(255,200,0,0.12);color:#FFC800">✓ ' + s.winner + ' ganador</span>' +
                  '<span style="font-size:10px;padding:3px 8px;border-radius:100px;font-weight:700;background:rgba(255,80,80,0.10);color:rgba(255,120,120,0.9)">✗ ' + s.lose + '</span>' +
                '</div>' +
              '</div>';
            }).join('');
          })()}
        </div>

        ${(function(){
            var allPreds = rows.filter(function(r){ return r.score && r.score !== '? — ?'; });
            if(allPreds.length === 0) return '';
            var homeCount = 0, drawCount = 0, awayCount = 0;
            allPreds.forEach(function(r){
              var pp = r.score.split(' — ');
              var ph = parseInt(pp[0]), pa = parseInt(pp[1]);
              if(ph > pa) homeCount++;
              else if(ph === pa) drawCount++;
              else awayCount++;
            });
            var scenarios = [];
            var hn = match ? match.home : 'Local';
            var an = match ? match.away : 'Visitante';
            if(homeCount === 0) scenarios.push('Si gana ' + hn);
            if(drawCount === 0) scenarios.push('Si empatan');
            if(awayCount === 0) scenarios.push('Si gana ' + an);
            if(scenarios.length === 0) return '';
            return '<div style="margin-top:12px;background:rgba(255,80,80,0.06);border:0.5px solid rgba(255,80,80,0.2);border-radius:12px;padding:14px;margin-bottom:14px">' +
              '<div style="font-size:10px;color:rgba(255,80,80,0.8);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px">💀 Nadie gana puntos si...</div>' +
              scenarios.map(function(s){ return '<div style="font-size:14px;font-weight:700;color:rgba(255,120,120,0.9);margin-bottom:4px">• ' + s + '</div>'; }).join('') +
              '<div style="font-size:10px;color:rgba(255,255,255,0.2);margin-top:6px">Todos los participantes pierden</div>' +
            '</div>';
          })()}

        <div class="card-footer">
          <span class="footer-url">pickbros.mx</span>
        </div>
      </div>`;

    // Show tab bar
    document.getElementById('tab-bar').style.display = 'flex';

  } catch(e) {
    document.getElementById('content-picks').innerHTML = `<div class="msg">Error: ${e.message}</div>`;
  }
}

let currentTab = 'picks';
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('content-picks').style.display = tab === 'picks' ? 'block' : 'none';
  document.getElementById('content-stats').style.display = tab === 'stats' ? 'block' : 'none';
  document.getElementById('tab-picks').style.background = tab === 'picks' ? '#00E676' : 'rgba(255,255,255,0.06)';
  document.getElementById('tab-picks').style.color = tab === 'picks' ? '#000' : 'rgba(255,255,255,0.6)';
  document.getElementById('tab-picks').style.border = tab === 'picks' ? 'none' : '1px solid rgba(255,255,255,0.1)';
  document.getElementById('tab-stats').style.background = tab === 'stats' ? '#00E676' : 'rgba(255,255,255,0.06)';
  document.getElementById('tab-stats').style.color = tab === 'stats' ? '#000' : 'rgba(255,255,255,0.6)';
  document.getElementById('tab-stats').style.border = tab === 'stats' ? 'none' : '1px solid rgba(255,255,255,0.1)';
}

document.getElementById('match-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') loadPicks();
});
</script>
</body>
