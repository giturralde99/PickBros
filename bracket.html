<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PickBros · Bracket</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=DM+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { width:100%; height:100%; font-family:'DM Sans',sans-serif; overflow-x:hidden; }
body {
  background:#0a0a0a;
  background-image: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(0,230,118,0.14) 0%, transparent 70%);
  background-attachment: fixed;
}
#wrap { display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:20px 0 40px; }
#titleBlock { flex-shrink:0; }
#mainArea { flex:1; display:flex; align-items:center; justify-content:center; width:100%; min-height:0; }
.top-bar { width:100%; max-width:480px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 18px 10px; gap:4px; }
.logo { font-family:'Black Han Sans',sans-serif; font-size:18px; color:#fff; }
.logo span { color:#00E676; }
.round-label { font-size:10px; color:rgba(255,255,255,0.35); letter-spacing:1.5px; text-transform:uppercase; }

#stage { position:relative; }
svg { position:absolute; top:0; left:0; pointer-events:none; }

.team-node { position:absolute; transform:translate(-50%,-50%); display:flex; align-items:center; justify-content:center; cursor:pointer; }
.flag-circle { border-radius:50%; display:flex; align-items:center; justify-content:center; transition:transform .1s; width:100%; height:100%; }
.flag-circle:active { transform:scale(0.9); }
.flag-circle .emoji { display:block; line-height:1; }

.state-winner .flag-circle { background:rgba(0,230,118,0.22); border:2px solid #00E676; box-shadow:0 0 8px rgba(0,230,118,0.3); }
.state-loser .flag-circle { background:rgba(0,0,0,0.65); border:1px solid rgba(255,255,255,0.07); }
.state-loser .flag-circle .emoji { opacity:0.22; }
.state-draw .flag-circle { background:rgba(255,200,0,0.15); border:2px solid rgba(255,200,0,0.6); }
.state-pending .flag-circle { background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.22); }
.state-empty .flag-circle { background:rgba(255,255,255,0.025); border:1px solid rgba(255,255,255,0.06); }
.tbd-mark { color:rgba(255,255,255,0.16); }

.trophy-center { position:absolute; transform:translate(-50%,-50%); border-radius:50%; background:rgba(0,230,118,0.12); border:1.5px solid rgba(0,230,118,0.5); display:flex; align-items:center; justify-content:center; }
.trophy-center.has-champ { background:rgba(0,230,118,0.25); border-color:#00E676; box-shadow:0 0 16px rgba(0,230,118,0.4); }

#overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none; align-items:center; justify-content:center; z-index:200; padding:20px; }
#overlay.show { display:flex; }
#modal { background:#0d1a12; border:1px solid rgba(0,230,118,0.2); border-radius:18px; padding:22px; max-width:320px; width:100%; text-align:center; animation:pop .15s ease; }
@keyframes pop { from{transform:scale(0.9); opacity:0} to{transform:scale(1); opacity:1} }
#modal-round { font-size:10px; color:#00E676; letter-spacing:1.5px; text-transform:uppercase; font-weight:800; margin-bottom:8px; }
#modal-teams { font-size:16px; font-weight:800; color:#fff; margin-bottom:6px; }
#modal-date { font-size:11px; color:rgba(255,255,255,0.4); margin-bottom:10px; }
#modal-score { font-size:30px; font-weight:900; color:#00E676; letter-spacing:-1px; margin:8px 0; }
#modal-winner { font-size:13px; color:rgba(255,255,255,0.6); font-weight:700; }
#modal-close { margin-top:16px; background:rgba(255,255,255,0.08); border:none; border-radius:10px; padding:10px 24px; color:#fff; font-family:'DM Sans'; font-weight:700; font-size:13px; cursor:pointer; }

#loading { color:rgba(255,255,255,0.4); font-size:13px; padding:60px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="titleBlock" class="top-bar">
    <div class="logo">PICK<span>BROS</span></div>
    <div class="round-label">Bracket Eliminatoria</div>
  </div>
  <div id="mainArea">
    <div id="loading">Cargando bracket...</div>
    <div id="stage"></div>
  </div>
</div>

<div id="overlay" onclick="if(event.target===this) closeModal()">
  <div id="modal">
    <div id="modal-round"></div>
    <div id="modal-teams"></div>
    <div id="modal-date"></div>
    <div id="modal-score"></div>
    <div id="modal-winner"></div>
    <button id="modal-close" onclick="closeModal()">Cerrar</button>
  </div>
</div>

<script>
const SB_URL = 'https://mktthenyladkhtptregx.supabase.co';
const SB_KEY = 'sb_publishable_Gj1rbCjl47I2Ienb6SKn-w_KeZs4zgL';
const sb = window.supabase.createClient(SB_URL, SB_KEY);

let SIZE, cx, cy;
const ROUND_LABELS = ['16avos','8vos','Cuartos','Semis','Final'];

function ang(i,n){ return (i/n)*2*Math.PI - Math.PI/2; }
function pt(r,a){ return { x: cx + r*Math.cos(a), y: cy + r*Math.sin(a) }; }
function midAngle(a1,a2){
  let d = a2-a1;
  while(d>Math.PI) d-=2*Math.PI;
  while(d<-Math.PI) d+=2*Math.PI;
  return a1 + d/2;
}

function setup(){
  SIZE = Math.min(window.innerWidth - 16, 560);
  cx = SIZE/2; cy = SIZE/2;
  const stage = document.getElementById('stage');
  stage.style.width = SIZE+'px';
  stage.style.height = SIZE+'px';
}

function svgLine(x1,y1,x2,y2,color,width){
  return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${color}" stroke-width="${width}" stroke-linecap="round"/>`;
}
function svgCircleDot(x,y,r,color){
  return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${color}"/>`;
}
function svgRing(r){
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,0.045)" stroke-width="0.5"/>`;
}

function getWinner(m){
  if(!m || !m.home_team || m.home_team==='Por definir') return null;
  if(m.home_score===null || m.away_score===null) return null;
  if(m.home_score===m.away_score) return null;
  return m.home_score > m.away_score
    ? {flag:m.home_flag, name:m.home_team}
    : {flag:m.away_flag, name:m.away_team};
}

function matchState(m){
  const hasResult = m && m.home_score !== null && m.away_score !== null;
  if(!hasResult) return {hasResult:false, homeWins:false, awayWins:false, isDraw:false};
  const homeWins = m.home_score > m.away_score;
  const awayWins = m.away_score > m.home_score;
  const isDraw = m.home_score === m.away_score;
  return {hasResult, homeWins, awayWins, isDraw};
}

function makeTeamDiv(point, d, flag, state, onClick){
  const div = document.createElement('div');
  div.className = 'team-node state-'+state;
  div.style.left = point.x+'px';
  div.style.top = point.y+'px';
  div.style.width = d+'px';
  div.style.height = d+'px';
  const fc = document.createElement('div');
  fc.className = 'flag-circle';
  if(state==='empty'){
    fc.innerHTML = `<span class="tbd-mark" style="font-size:${d*0.42}px">?</span>`;
  } else {
    fc.innerHTML = `<span class="emoji" style="font-size:${d*0.5}px">${flag}</span>`;
  }
  div.appendChild(fc);
  if(onClick) div.onclick = onClick;
  return div;
}

function render(r16matches){
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  let svgParts = '';

  // Official bracket pairing order (by match_id index 0-15, where index = match_id - 101)
  const BRACKET_PAIRS = [
    [0,3], [2,5], [8,9], [10,11],
    [1,4], [6,7], [12,15], [13,14],
  ];
  const ORDER = [];
  BRACKET_PAIRS.forEach(([a,b]) => { ORDER.push(a); ORDER.push(b); });

  // Build 5 rounds of team-slots
  // Round 0: 32 slots from r16matches (16 matches x 2 teams)
  // Round r (1..4): teamCount halves each time -> 16,8,4,2
  const roundTeamCounts = [32,16,8,4,2];
  const radii = [SIZE*0.46, SIZE*0.355, SIZE*0.255, SIZE*0.165, SIZE*0.095];
  const nodeDiams = [SIZE*0.046, SIZE*0.05, SIZE*0.054, SIZE*0.058, SIZE*0.062];

  // slots[r][i] = {flag,name,state} or null for TBD/empty
  const slots = [];
  // Round 0
  slots[0] = [];
  for(let i=0;i<16;i++){
    const m = r16matches[i] || {};
    const isPDef = !m.home_team || m.home_team === 'Por definir';
    slots[0][2*i]   = isPDef ? null : {flag:m.home_team_flag||m.home_flag, name:m.home_team};
    slots[0][2*i+1] = isPDef ? null : {flag:m.away_team_flag||m.away_flag, name:m.away_team};
  }
  // Build "matches" array per round for state computation & advancing
  const matchesByRound = [r16matches];

  for(let r=1; r<5; r++){
    const prevCount = roundTeamCounts[r-1];
    const count = roundTeamCounts[r];
    slots[r] = [];
    const roundMatches = [];
    for(let i=0;i<count;i++){
      const a = slots[r-1][2*i];
      const b = slots[r-1][2*i+1];
      // synthetic match between a and b (no score yet, since not played)
      // we don't have explicit score data beyond round0 in this simplified version
      roundMatches.push({ home_team:a?a.name:null, away_team:b?b.name:null, home_flag:a?a.flag:null, away_flag:b?b.flag:null, home_score:null, away_score:null });
      slots[r][i] = null; // winner unknown until that round's match is decided (no data yet)
    }
    matchesByRound[r] = roundMatches;
  }

  // Helper to compute winner flag/name from round r-1 pair using matchesByRound[r-1] decided results
  // For round0 matches, results come from r16matches (have scores). For round>=1 we don't have real score data
  // (future rounds not played yet), so winner is null unless round-1 pair both exist and round-1's match score decided —
  // but round-1 "matches" are synthetic above with no scores. We only really propagate ROUND 0 results upward one level.
  function round0Winner(displayIdx){
    // displayIdx is the position in display order (0-15); map back to original match index via ORDER
    const origIdx = ORDER[displayIdx];
    const m = r16matches[origIdx];
    return getWinner(m);
  }

  // Draw rings
  radii.forEach(r => svgParts += svgRing(r));

  // ===== ROUND 0 (32 outer team slots, paired into 16 matches) =====
  for(let i=0;i<16;i++){
    const origIdx = ORDER[i];
    const m = r16matches[origIdx] || {};
    const aHome = ang(2*i, 32);
    const aAway = ang(2*i+1, 32);
    const aJunc = midAngle(aHome, aAway);
    const hPt = pt(radii[0], aHome);
    const aPt = pt(radii[0], aAway);
    const jPt = pt(radii[1], aJunc);

    const isPDef = !m.home_team || m.home_team === 'Por definir';
    const st = matchState(m);

    if(!isPDef){
      const winColor = 'rgba(0,230,118,0.45)';
      const drawColor = 'rgba(255,200,0,0.4)';
      const dimColor = 'rgba(255,255,255,0.04)';
      const normColor = 'rgba(255,255,255,0.13)';
      const hColor = st.isDraw?drawColor : st.homeWins?winColor : (st.hasResult?dimColor:normColor);
      const aColor = st.isDraw?drawColor : st.awayWins?winColor : (st.hasResult?dimColor:normColor);
      svgParts += svgLine(hPt.x,hPt.y,jPt.x,jPt.y,hColor, (st.homeWins||st.isDraw)?2:1);
      svgParts += svgLine(aPt.x,aPt.y,jPt.x,jPt.y,aColor, (st.awayWins||st.isDraw)?2:1);
      svgParts += svgCircleDot(jPt.x,jPt.y, st.hasResult?3:2, st.hasResult?'rgba(0,230,118,0.55)':'rgba(255,255,255,0.15)');

      const hState = !st.hasResult?'pending': st.isDraw?'draw': st.homeWins?'winner':'loser';
      const aState = !st.hasResult?'pending': st.isDraw?'draw': st.awayWins?'winner':'loser';

      const onClick = () => openModal(m, ROUND_LABELS[0]);
      stage.appendChild(makeTeamDiv(hPt, nodeDiams[0], m.home_flag||'🏳️', hState, onClick));
      stage.appendChild(makeTeamDiv(aPt, nodeDiams[0], m.away_flag||'🏳️', aState, onClick));
    } else {
      stage.appendChild(makeTeamDiv(hPt, nodeDiams[0], '', 'empty', null));
      stage.appendChild(makeTeamDiv(aPt, nodeDiams[0], '', 'empty', null));
    }
  }

  // ===== ROUND 1 (8vos) — 16 slots, winners of round0 matches =====
  // Each round1 slot sits at the angle of the JUNCTION of its source match (midpoint between the 2 round0 teams)
  const round1Angles = [];
  for(let i=0;i<16;i++){
    const aHome = ang(2*i, 32), aAway = ang(2*i+1, 32);
    round1Angles[i] = midAngle(aHome, aAway);
  }
  for(let i=0;i<16;i++){
    const winner = round0Winner(i);
    const a = round1Angles[i];
    const p = pt(radii[1], a);
    if(winner){
      stage.appendChild(makeTeamDiv(p, nodeDiams[1], winner.flag, 'winner', () => openInfoSimple(winner.name, ROUND_LABELS[1])));
    } else {
      stage.appendChild(makeTeamDiv(p, nodeDiams[1], '', 'empty', null));
    }
  }
  // Lines: round1 pairs (2i,2i+1) -> round2 junction
  for(let i=0;i<8;i++){
    const a1 = round1Angles[2*i], a2 = round1Angles[2*i+1];
    const p1 = pt(radii[1],a1), p2 = pt(radii[1],a2);
    const aJ = midAngle(a1,a2);
    const jPt = pt(radii[2], aJ);
    const w1 = round0Winner(2*i), w2 = round0Winner(2*i+1);
    svgParts += svgLine(p1.x,p1.y,jPt.x,jPt.y, w1?'rgba(0,230,118,0.3)':'rgba(255,255,255,0.05)', w1?1.5:1);
    svgParts += svgLine(p2.x,p2.y,jPt.x,jPt.y, w2?'rgba(0,230,118,0.3)':'rgba(255,255,255,0.05)', w2?1.5:1);
  }

  // ===== ROUND 2 (Cuartos) — 8 slots, positioned at junction angle of round1 pairs =====
  const round2Angles = [];
  for(let i=0;i<8;i++){
    round2Angles[i] = midAngle(round1Angles[2*i], round1Angles[2*i+1]);
  }
  for(let i=0;i<8;i++){
    const p = pt(radii[2], round2Angles[i]);
    stage.appendChild(makeTeamDiv(p, nodeDiams[2], '', 'empty', null));
  }
  for(let i=0;i<4;i++){
    const a1=round2Angles[2*i], a2=round2Angles[2*i+1];
    const p1=pt(radii[2],a1), p2=pt(radii[2],a2);
    const aJ=midAngle(a1,a2);
    const jPt=pt(radii[3],aJ);
    svgParts += svgLine(p1.x,p1.y,jPt.x,jPt.y,'rgba(255,255,255,0.04)',1);
    svgParts += svgLine(p2.x,p2.y,jPt.x,jPt.y,'rgba(255,255,255,0.04)',1);
  }

  // ===== ROUND 3 (Semis) — 4 slots, positioned at junction angle of round2 pairs =====
  const round3Angles = [];
  for(let i=0;i<4;i++){
    round3Angles[i] = midAngle(round2Angles[2*i], round2Angles[2*i+1]);
  }
  for(let i=0;i<4;i++){
    const p = pt(radii[3], round3Angles[i]);
    stage.appendChild(makeTeamDiv(p, nodeDiams[3], '', 'empty', null));
  }
  for(let i=0;i<2;i++){
    const a1=round3Angles[2*i], a2=round3Angles[2*i+1];
    const p1=pt(radii[3],a1), p2=pt(radii[3],a2);
    const aJ=midAngle(a1,a2);
    const jPt=pt(radii[4],aJ);
    svgParts += svgLine(p1.x,p1.y,jPt.x,jPt.y,'rgba(255,255,255,0.04)',1);
    svgParts += svgLine(p2.x,p2.y,jPt.x,jPt.y,'rgba(255,255,255,0.04)',1);
  }

  // ===== ROUND 4 (Final) — 2 slots, positioned at junction angle of round3 pairs =====
  const round4Angles = [];
  round4Angles[0] = midAngle(round3Angles[0], round3Angles[1]);
  round4Angles[1] = midAngle(round3Angles[2], round3Angles[3]);
  for(let i=0;i<2;i++){
    const p = pt(radii[4], round4Angles[i]);
    stage.appendChild(makeTeamDiv(p, nodeDiams[4], '', 'empty', null));
  }
  // Lines from final slots to center
  for(let i=0;i<2;i++){
    const p = pt(radii[4], round4Angles[i]);
    svgParts += svgLine(p.x,p.y,cx,cy,'rgba(255,255,255,0.05)',1);
  }

  const svgEl = document.createElement('div');
  svgEl.innerHTML = `<svg width="${SIZE}" height="${SIZE}">${svgParts}</svg>`;
  stage.prepend(svgEl.firstChild);

  // Center trophy
  const RFIN = SIZE*0.05;
  const trophy = document.createElement('div');
  trophy.className = 'trophy-center';
  trophy.style.left = cx+'px'; trophy.style.top = cy+'px';
  trophy.style.width = (RFIN*2)+'px'; trophy.style.height = (RFIN*2)+'px';
  trophy.innerHTML = `<span style="font-size:${RFIN*1.1}px">🏆</span>`;
  stage.appendChild(trophy);
}

function openModal(m, roundLabel){
  document.getElementById('modal-round').textContent = roundLabel;
  document.getElementById('modal-teams').textContent = `${m.home_flag||'🏳️'} ${m.home_team}  vs  ${m.away_team} ${m.away_flag||'🏳️'}`;
  document.getElementById('modal-date').textContent = m.match_date || 'Fecha por confirmar';
  const scoreEl = document.getElementById('modal-score');
  const winEl = document.getElementById('modal-winner');
  if(m.home_score !== null && m.away_score !== null){
    scoreEl.textContent = `${m.home_score} — ${m.away_score}`;
    scoreEl.style.display='block';
    const w = m.home_score > m.away_score ? m.home_team : m.away_score > m.home_score ? m.away_team : null;
    winEl.textContent = w ? `🏆 Avanza: ${w}` : '🟡 Empate';
    winEl.style.display='block';
  } else {
    scoreEl.style.display='none';
    winEl.textContent = '⏳ Partido pendiente';
    winEl.style.display='block';
  }
  document.getElementById('overlay').classList.add('show');
}
function openInfoSimple(name, roundLabel){
  document.getElementById('modal-round').textContent = roundLabel;
  document.getElementById('modal-teams').textContent = `${name} avanzó a ${roundLabel}`;
  document.getElementById('modal-date').textContent = '';
  document.getElementById('modal-score').style.display='none';
  document.getElementById('modal-winner').textContent = '✅ Esperando rival';
  document.getElementById('modal-winner').style.display='block';
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){ document.getElementById('overlay').classList.remove('show'); }

async function init(){
  setup();
  const { data: sess } = await sb.auth.getSession();
  if(!sess?.session){
    await sb.auth.signInWithPassword({ email:'admin@pickbros.com', password:'Admin2026' });
  }
  const { data, error } = await sb.from('elimination_matches').select('*').eq('round','16avos').order('id');

  document.getElementById('loading').style.display='none';
  if(error || !data){
    document.getElementById('loading').textContent='Error cargando datos';
    document.getElementById('loading').style.display='block';
    return;
  }
  const matches = [...data];
  while(matches.length < 16){
    matches.push({ home_team:'Por definir', away_team:'Por definir', home_flag:'🏳️', away_flag:'🏳️', home_score:null, away_score:null });
  }
  render(matches);
}
init();
</script>
</body>
</html>
