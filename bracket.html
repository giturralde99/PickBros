<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PickBros · Bracket</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=DM+Sans:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { width:100%; height:100%; background:#080c09; overflow:hidden; font-family:'DM Sans',sans-serif; }
#wrap { display:flex; flex-direction:column; align-items:center; height:100%; }
.top-bar { width:100%; display:flex; align-items:center; justify-content:space-between; padding:12px 16px 6px; flex-shrink:0; }
.logo { font-family:'Black Han Sans',sans-serif; font-size:18px; color:#fff; }
.logo span { color:#00E676; }
.round-label { font-size:10px; color:rgba(255,255,255,0.35); letter-spacing:1.5px; text-transform:uppercase; }
#canvasWrap { flex:1; display:flex; align-items:center; justify-content:center; width:100%; min-height:0; }
canvas { touch-action:none; }
#tooltip { position:fixed; bottom:0; left:0; right:0; background:#0d1a12; border-top:1px solid rgba(0,230,118,0.2); padding:14px 20px; display:none; z-index:99; animation:slideUp 0.2s ease; }
@keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
#tooltip.show { display:block; }
#tip-match { font-size:14px; font-weight:800; color:#fff; margin-bottom:4px; }
#tip-detail { font-size:11px; color:rgba(255,255,255,0.5); }
#tip-result { font-size:13px; font-weight:700; color:#00E676; margin-top:4px; }
#tip-close { position:absolute; top:12px; right:16px; color:rgba(255,255,255,0.3); font-size:18px; cursor:pointer; }
#loading { color:rgba(255,255,255,0.4); font-size:13px; }
</style>
</head>
<body>
<div id="wrap">
  <div class="top-bar">
    <div class="logo">PICK<span>BROS</span></div>
    <div class="round-label">16avos de Final</div>
  </div>
  <div id="canvasWrap">
    <div id="loading">Cargando bracket...</div>
    <canvas id="c" style="display:none"></canvas>
  </div>
</div>
<div id="tooltip">
  <span id="tip-close" onclick="closeTip()">✕</span>
  <div id="tip-match"></div>
  <div id="tip-detail"></div>
  <div id="tip-result"></div>
</div>
<script>
const SB_URL = 'https://mktthenyladkhtptregx.supabase.co';
const SB_KEY = 'sb_publishable_Gj1rbCjl47I2Ienb6SKn-w_KeZs4zgL';
const sb = window.supabase.createClient(SB_URL, SB_KEY);

const GREEN = '#00E676';
const DPR = window.devicePixelRatio || 2;
const nodes = [];
let canvas, ctx, SIZE, cx, cy;
let R0, R1, R2, R3, RFIN, NODE_R;

// 32 outer slots (one per team). Pairs (0,1),(2,3)...(30,31) are the 16 matches.
const TOTAL = 32;

function setup() {
  const wrap = document.getElementById('canvasWrap');
  SIZE = Math.min(wrap.clientWidth, wrap.clientHeight) - 8;
  SIZE = Math.min(SIZE, 480);

  canvas = document.getElementById('c');
  canvas.width = SIZE * DPR;
  canvas.height = SIZE * DPR;
  canvas.style.width = SIZE + 'px';
  canvas.style.height = SIZE + 'px';
  canvas.style.display = 'block';

  ctx = canvas.getContext('2d');
  ctx.setTransform(DPR,0,0,DPR,0,0);

  cx = SIZE/2; cy = SIZE/2;
  R0   = SIZE * 0.435;  // outer: 32 teams
  R1   = SIZE * 0.335;  // 16 junctions (winners -> 8vos)
  R2   = SIZE * 0.235;  // 8 junctions (-> cuartos)
  R3   = SIZE * 0.145;  // 4 junctions (-> semis)
  RFIN = SIZE * 0.055;  // center / champion
  NODE_R = SIZE * 0.034;
}

function ang(i, n) { return (i/n) * 2*Math.PI - Math.PI/2; }
function pt(r,a){ return { x: cx + r*Math.cos(a), y: cy + r*Math.sin(a) }; }
function midAngle(a1,a2){
  // handles wraparound properly for angles near -PI/PI boundary
  let d = a2 - a1;
  while(d > Math.PI) d -= 2*Math.PI;
  while(d < -Math.PI) d += 2*Math.PI;
  return a1 + d/2;
}

function drawRing(r){
  ctx.beginPath();
  ctx.arc(cx,cy,r,0,2*Math.PI);
  ctx.strokeStyle='rgba(255,255,255,0.045)';
  ctx.lineWidth=0.5;
  ctx.stroke();
}

function drawCenter(){
  const grd = ctx.createRadialGradient(cx,cy,0,cx,cy,RFIN*2.6);
  grd.addColorStop(0,'rgba(0,230,118,0.16)');
  grd.addColorStop(1,'rgba(0,230,118,0)');
  ctx.beginPath(); ctx.arc(cx,cy,RFIN*2.6,0,2*Math.PI); ctx.fillStyle=grd; ctx.fill();

  ctx.beginPath();
  ctx.arc(cx,cy,RFIN,0,2*Math.PI);
  ctx.fillStyle='rgba(0,230,118,0.12)'; ctx.fill();
  ctx.strokeStyle='rgba(0,230,118,0.5)'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.font=`${RFIN*1.15}px serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🏆', cx, cy);
}

function drawTeamNode(x,y,flag,name,state){
  // state: winner | loser | pending | empty
  if(state==='winner'){
    ctx.beginPath(); ctx.arc(x,y,NODE_R+3,0,2*Math.PI);
    ctx.fillStyle='rgba(0,230,118,0.10)'; ctx.fill();
  }
  ctx.beginPath();
  ctx.arc(x,y,NODE_R,0,2*Math.PI);
  ctx.fillStyle = state==='winner' ? 'rgba(0,230,118,0.22)'
                : state==='loser'  ? 'rgba(0,0,0,0.65)'
                : state==='empty'  ? 'rgba(255,255,255,0.025)'
                :                    'rgba(255,255,255,0.07)';
  ctx.fill();
  ctx.strokeStyle = state==='winner' ? GREEN
                  : state==='loser'  ? 'rgba(255,255,255,0.07)'
                  : state==='empty'  ? 'rgba(255,255,255,0.06)'
                  :                    'rgba(255,255,255,0.22)';
  ctx.lineWidth = state==='winner' ? 1.8 : 1;
  ctx.stroke();

  if(state!=='empty'){
    ctx.globalAlpha = state==='loser' ? 0.25 : 1;
    ctx.font = `${NODE_R*0.95}px serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(flag, x, y);
    ctx.globalAlpha = 1;
  } else {
    ctx.font = `${NODE_R*0.8}px system-ui`;
    ctx.fillStyle='rgba(255,255,255,0.18)';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('?', x, y);
  }
}

function drawLabel(x,y,name,state,angle){
  if(state==='empty' || !name) return;
  const off = NODE_R + SIZE*0.028;
  const lx = x + Math.cos(angle)*off;
  const ly = y + Math.sin(angle)*off;
  ctx.font = `bold ${SIZE*0.026}px 'DM Sans',system-ui`;
  ctx.fillStyle = state==='winner' ? GREEN : state==='loser' ? 'rgba(255,255,255,0.18)' : 'rgba(255,255,255,0.65)';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(name, lx, ly);
}

function render(matches){
  ctx.clearRect(0,0,SIZE,SIZE);
  nodes.length = 0;

  [R0+NODE_R*1.4, R1, R2, R3].forEach(drawRing);
  drawCenter();

  // For each match i (0..15), teams sit at outer slots 2i and 2i+1
  matches.forEach((m,i) => {
    const aHome = ang(2*i, TOTAL);
    const aAway = ang(2*i+1, TOTAL);
    const aJunc = midAngle(aHome, aAway); // angle for round-1 junction

    const hPt = pt(R0, aHome);
    const aPt = pt(R0, aAway);
    const jPt = pt(R1, aJunc);

    const isPDef = !m.home_team || m.home_team === 'Por definir';
    const hasResult = m.home_score !== null && m.away_score !== null;
    const homeWins = hasResult && m.home_score > m.away_score;
    const awayWins = hasResult && m.away_score > m.home_score;
    const isDraw = hasResult && m.home_score === m.away_score;

    if(!isPDef){
      // Lines: home -> junction, away -> junction
      const winColor = 'rgba(0,230,118,0.4)';
      const dimColor = 'rgba(255,255,255,0.05)';
      const normColor = 'rgba(255,255,255,0.12)';

      ctx.lineJoin='round'; ctx.lineCap='round';

      ctx.beginPath(); ctx.moveTo(hPt.x,hPt.y); ctx.lineTo(jPt.x,jPt.y);
      ctx.strokeStyle = homeWins ? winColor : (awayWins ? dimColor : normColor);
      ctx.lineWidth = homeWins ? 2 : 1;
      ctx.stroke();

      ctx.beginPath(); ctx.moveTo(aPt.x,aPt.y); ctx.lineTo(jPt.x,jPt.y);
      ctx.strokeStyle = awayWins ? winColor : (homeWins ? dimColor : normColor);
      ctx.lineWidth = awayWins ? 2 : 1;
      ctx.stroke();

      // Junction dot
      ctx.beginPath();
      ctx.arc(jPt.x,jPt.y, hasResult?3.2:2.2, 0, 2*Math.PI);
      ctx.fillStyle = hasResult ? 'rgba(0,230,118,0.55)' : 'rgba(255,255,255,0.15)';
      ctx.fill();

      const hState = !hasResult ? 'pending' : (homeWins||isDraw) ? 'winner' : 'loser';
      const aState = !hasResult ? 'pending' : (awayWins||isDraw) ? 'winner' : 'loser';

      drawTeamNode(hPt.x,hPt.y, m.home_flag||'🏳️', m.home_team, hState);
      drawTeamNode(aPt.x,aPt.y, m.away_flag||'🏳️', m.away_team, aState);
      drawLabel(hPt.x,hPt.y, shortName(m.home_team), hState, aHome);
      drawLabel(aPt.x,aPt.y, shortName(m.away_team), aState, aAway);

      nodes.push({x:hPt.x,y:hPt.y,m,team:'home'});
      nodes.push({x:aPt.x,y:aPt.y,m,team:'away'});
    } else {
      drawTeamNode(hPt.x,hPt.y,'','', 'empty');
      drawTeamNode(aPt.x,aPt.y,'','', 'empty');
    }
  });

  // Junction -> next round lines + TBD nodes for rounds 2,3,4
  for(let i=0;i<16;i++){
    const aJunc = midAngle(ang(2*i,TOTAL), ang(2*i+1,TOTAL));
    const jPt = pt(R1, aJunc);
    // pair junctions into groups of 2 for next level
    if(i % 2 === 0){
      const aJunc2 = midAngle(ang(2*i,TOTAL), ang(2*i+1,TOTAL));
      const aJuncNext = midAngle(ang(2*i,TOTAL), ang(2*(i+1)+1,TOTAL));
      const nPt = pt(R2, aJuncNext);
      const j1 = pt(R1, midAngle(ang(2*i,TOTAL),ang(2*i+1,TOTAL)));
      const j2 = pt(R1, midAngle(ang(2*(i+1),TOTAL),ang(2*(i+1)+1,TOTAL)));
      ctx.beginPath(); ctx.moveTo(j1.x,j1.y); ctx.lineTo(nPt.x,nPt.y);
      ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=1; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(j2.x,j2.y); ctx.lineTo(nPt.x,nPt.y);
      ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=1; ctx.stroke();
      drawTeamNode(nPt.x,nPt.y,'','','empty');
    }
  }
  // Round 3 (4 nodes) and Final (2 nodes) — simplified placeholders
  for(let i=0;i<4;i++){
    const a = midAngle(ang(8*i,TOTAL), ang(8*i+7,TOTAL));
    const p = pt(R3, a);
    drawTeamNode(p.x,p.y,'','','empty');
  }
}

function shortName(name){
  if(!name) return '';
  const map = {'Sudafrica':'RSA','Canada':'CAN','Brasil':'BRA','Japon':'JPN','Alemania':'GER','Paraguay':'PAR','Paises Bajos':'NED','Marruecos':'MAR','Costa de Marfil':'CIV','Noruega':'NOR','Francia':'FRA','Suecia':'SWE','Mexico':'MEX','Ecuador':'ECU','Inglaterra':'ENG','RD del Congo':'COD','Belgica':'BEL','Senegal':'SEN','Estados Unidos':'USA','Bosnia y Herz.':'BIH','Espana':'ESP','Austria':'AUT','Portugal':'POR','Croacia':'CRO','Suiza':'SUI','Argelia':'ALG','Australia':'AUS','Egipto':'EGY','Argentina':'ARG','Cabo Verde':'CPV','Colombia':'COL','Ghana':'GHA'};
  return map[name] || name.substring(0,3).toUpperCase();
}

function closeTip(){ document.getElementById('tooltip').classList.remove('show'); }

function showTip(m){
  const tip = document.getElementById('tooltip');
  document.getElementById('tip-match').textContent = `${m.home_flag||'🏳️'} ${m.home_team}  vs  ${m.away_team} ${m.away_flag||'🏳️'}`;
  document.getElementById('tip-detail').textContent = m.match_date || 'Fecha por confirmar';
  const res = document.getElementById('tip-result');
  if(m.home_score !== null && m.away_score !== null){
    const w = m.home_score > m.away_score ? m.home_team : m.away_score > m.home_score ? m.away_team : 'Empate';
    res.textContent = `${m.home_score} — ${m.away_score} · Ganador: ${w}`;
    res.style.display='block';
  } else { res.style.display='none'; }
  tip.classList.add('show');
}

function handleClick(e){
  const rect = canvas.getBoundingClientRect();
  const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
  const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
  const mx = (clientX-rect.left)*(SIZE/rect.width);
  const my = (clientY-rect.top)*(SIZE/rect.height);
  for(const n of nodes){
    const dx=mx-n.x, dy=my-n.y;
    if(Math.sqrt(dx*dx+dy*dy) < NODE_R+8){ showTip(n.m); return; }
  }
  closeTip();
}

async function init(){
  setup();
  const { data: sess } = await sb.auth.getSession();
  if(!sess?.session){
    await sb.auth.signInWithPassword({ email:'admin@pickbros.com', password:'Admin2026' });
  }
  const { data, error } = await sb.from('elimination_matches').select('*').eq('round','16avos').order('id');

  document.getElementById('loading').style.display='none';
  if(error || !data){
    document.getElementById('loading').textContent='Error cargando datos';
    document.getElementById('loading').style.display='block';
    return;
  }
  const matches = [...data];
  while(matches.length < 16){
    matches.push({ home_team:'Por definir', away_team:'Por definir', home_flag:'🏳️', away_flag:'🏳️', home_score:null, away_score:null });
  }
  render(matches);
  canvas.addEventListener('click', handleClick);
  canvas.addEventListener('touchend', e => { e.preventDefault(); handleClick(e); }, {passive:false});
}
init();
</script>
</body>
</html>
