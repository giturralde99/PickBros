<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PickBros · Bracket</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=DM+Sans:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { width:100%; height:100%; background:#080c09; overflow:hidden; font-family:'DM Sans',sans-serif; }

#wrap { display:flex; flex-direction:column; align-items:center; height:100%; }

.top-bar { width:100%; display:flex; align-items:center; justify-content:space-between; padding:12px 16px 6px; flex-shrink:0; }
.logo { font-family:'Black Han Sans',sans-serif; font-size:18px; color:#fff; }
.logo span { color:#00E676; }
.round-label { font-size:10px; color:rgba(255,255,255,0.35); letter-spacing:1.5px; text-transform:uppercase; }

#canvasWrap { flex:1; display:flex; align-items:center; justify-content:center; width:100%; }
canvas { touch-action:none; }

#tooltip { 
  position:fixed; bottom:0; left:0; right:0;
  background:#0d1a12; border-top:1px solid rgba(0,230,118,0.2);
  padding:14px 20px; display:none; z-index:99;
  animation:slideUp 0.2s ease;
}
@keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
#tooltip.show { display:block; }
#tip-match { font-size:15px; font-weight:800; color:#fff; margin-bottom:4px; }
#tip-detail { font-size:12px; color:rgba(255,255,255,0.5); }
#tip-result { font-size:14px; font-weight:700; color:#00E676; margin-top:4px; }
#tip-close { position:absolute; top:12px; right:16px; color:rgba(255,255,255,0.3); font-size:18px; cursor:pointer; }

#loading { color:rgba(255,255,255,0.4); font-size:13px; padding:40px; }
</style>
</head>
<body>
<div id="wrap">
  <div class="top-bar">
    <div class="logo">PICK<span>BROS</span></div>
    <div class="round-label">16avos de Final</div>
  </div>
  <div id="canvasWrap">
    <div id="loading">Cargando bracket...</div>
    <canvas id="c" style="display:none"></canvas>
  </div>
</div>

<div id="tooltip">
  <span id="tip-close" onclick="closeTip()">✕</span>
  <div id="tip-match"></div>
  <div id="tip-detail"></div>
  <div id="tip-result"></div>
</div>

<script>
const SB_URL = 'https://mktthenyladkhtptregx.supabase.co';
const SB_KEY = 'sb_publishable_Gj1rbCjl47I2Ienb6SKn-w_KeZs4zgL';
const sb = window.supabase.createClient(SB_URL, SB_KEY);

const GREEN = '#00E676';
const DPR = window.devicePixelRatio || 2;
const nodes = [];
let canvas, ctx, SIZE, cx, cy;

// Radii
let RR16, RR8, RQF, RSF, RFIN, NODE_R, LABEL_OFF;

function setup() {
  const wrap = document.getElementById('canvasWrap');
  SIZE = Math.min(wrap.clientWidth, wrap.clientHeight, 420);
  
  canvas = document.getElementById('c');
  canvas.width = SIZE * DPR;
  canvas.height = SIZE * DPR;
  canvas.style.width = SIZE + 'px';
  canvas.style.height = SIZE + 'px';
  canvas.style.display = 'block';
  
  ctx = canvas.getContext('2d');
  ctx.scale(DPR, DPR);
  
  cx = SIZE / 2; cy = SIZE / 2;
  RR16 = SIZE * 0.44;
  RR8  = SIZE * 0.32;
  RQF  = SIZE * 0.215;
  RSF  = SIZE * 0.128;
  RFIN = SIZE * 0.055;
  NODE_R = SIZE * 0.055;
  LABEL_OFF = NODE_R + SIZE * 0.035;
}

function ang(i, n) { return (i / n) * 2 * Math.PI - Math.PI / 2; }
function pt(r, a) { return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) }; }

function drawRings() {
  [RR16 + NODE_R * 1.3, RR8 + 2, RQF + 2, RSF + 2].forEach(r => {
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, 2 * Math.PI);
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 0.5;
    ctx.stroke();
  });
}

function drawCenter() {
  // Glow
  const grd = ctx.createRadialGradient(cx,cy,0,cx,cy,RFIN*2);
  grd.addColorStop(0,'rgba(0,230,118,0.15)');
  grd.addColorStop(1,'rgba(0,230,118,0)');
  ctx.beginPath();
  ctx.arc(cx,cy,RFIN*2.5,0,2*Math.PI);
  ctx.fillStyle=grd; ctx.fill();

  ctx.beginPath();
  ctx.arc(cx, cy, RFIN, 0, 2 * Math.PI);
  ctx.fillStyle = 'rgba(0,230,118,0.1)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,230,118,0.5)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.font = `${RFIN * 1.1}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🏆', cx, cy);
}

function drawNode(x, y, flag, name, state) {
  // state: 'winner' | 'loser' | 'pending' | 'tbd'
  const isTBD = state === 'tbd';
  const r = isTBD ? NODE_R * 0.6 : NODE_R;

  // Shadow/glow for winner
  if (state === 'winner') {
    ctx.beginPath();
    ctx.arc(x, y, r + 4, 0, 2 * Math.PI);
    ctx.fillStyle = 'rgba(0,230,118,0.12)';
    ctx.fill();
  }

  ctx.beginPath();
  ctx.arc(x, y, r, 0, 2 * Math.PI);
  ctx.fillStyle = state==='winner' ? 'rgba(0,230,118,0.22)'
                : state==='loser'  ? 'rgba(0,0,0,0.7)'
                : state==='tbd'    ? 'rgba(255,255,255,0.03)'
                :                    'rgba(255,255,255,0.07)';
  ctx.fill();
  ctx.strokeStyle = state==='winner' ? GREEN
                  : state==='loser'  ? 'rgba(255,255,255,0.06)'
                  : state==='tbd'    ? 'rgba(255,255,255,0.07)'
                  :                    'rgba(255,255,255,0.22)';
  ctx.lineWidth = state==='winner' ? 2 : 1;
  ctx.stroke();

  if (!isTBD) {
    ctx.globalAlpha = state==='loser' ? 0.22 : 1;
    ctx.font = `${r * 0.9}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.fillText(flag, x, y);
    ctx.globalAlpha = 1;

    // Label
    const a = Math.atan2(y - cy, x - cx);
    const lx = x + Math.cos(a) * LABEL_OFF;
    const ly = y + Math.sin(a) * LABEL_OFF;
    ctx.font = `bold ${r * 0.48}px 'DM Sans',system-ui`;
    ctx.fillStyle = state==='winner' ? GREEN
                  : state==='loser'  ? 'rgba(255,255,255,0.18)'
                  :                    'rgba(255,255,255,0.65)';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(name.length > 5 ? name.substring(0,5) : name, lx, ly);
  } else {
    ctx.font = `${r * 0.7}px system-ui`;
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('?', x, y);
  }
}

function drawBracketLines(hPt, aPt, jPt, nextPt, homeWins, awayWins, hasResult) {
  const winnerColor = 'rgba(0,230,118,0.35)';
  const normalColor = 'rgba(255,255,255,0.1)';
  const dimColor    = 'rgba(255,255,255,0.04)';

  ctx.lineJoin = 'round';
  ctx.lineCap  = 'round';

  // Home → junction
  ctx.beginPath();
  ctx.moveTo(hPt.x, hPt.y);
  ctx.lineTo(jPt.x, jPt.y);
  ctx.strokeStyle = homeWins ? winnerColor : (awayWins && hasResult ? dimColor : normalColor);
  ctx.lineWidth = homeWins ? 2 : 1;
  ctx.stroke();

  // Away → junction
  ctx.beginPath();
  ctx.moveTo(aPt.x, aPt.y);
  ctx.lineTo(jPt.x, jPt.y);
  ctx.strokeStyle = awayWins ? winnerColor : (homeWins && hasResult ? dimColor : normalColor);
  ctx.lineWidth = awayWins ? 2 : 1;
  ctx.stroke();

  // Junction dot
  ctx.beginPath();
  ctx.arc(jPt.x, jPt.y, hasResult ? 3.5 : 2.5, 0, 2 * Math.PI);
  ctx.fillStyle = hasResult ? 'rgba(0,230,118,0.6)' : 'rgba(255,255,255,0.18)';
  ctx.fill();

  // Junction → next round
  ctx.beginPath();
  ctx.moveTo(jPt.x, jPt.y);
  ctx.lineTo(nextPt.x, nextPt.y);
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function render(matches) {
  ctx.clearRect(0, 0, SIZE, SIZE);
  nodes.length = 0;
  
  drawRings();
  drawCenter();

  const N = 16;
  matches.forEach((m, i) => {
    const a    = ang(i, N);
    const hPt  = pt(RR16, a);
    const aPt  = pt(RR8 + NODE_R * 0.4, a);
    const jPt  = pt(RR8 - NODE_R * 1.1, a);
    const nPt  = pt(RQF + NODE_R * 0.5, a);

    const hasResult = m.home_score !== null && m.away_score !== null;
    const homeWins  = hasResult && m.home_score > m.away_score;
    const awayWins  = hasResult && m.away_score > m.home_score;
    const isDraw    = hasResult && m.home_score === m.away_score;

    const isPDef = !m.home_team || m.home_team === 'Por definir';

    if (!isPDef) {
      drawBracketLines(hPt, aPt, jPt, nPt, homeWins, awayWins, hasResult);
      
      const hState = !hasResult ? 'pending' : homeWins || isDraw ? 'winner' : 'loser';
      const aState = !hasResult ? 'pending' : awayWins || isDraw ? 'winner' : 'loser';
      
      drawNode(hPt.x, hPt.y, m.home_flag||'🏳️', m.home_team||'?', hState);
      drawNode(aPt.x, aPt.y, m.away_flag||'🏳️', m.away_team||'?', aState);

      nodes.push({ x:hPt.x, y:hPt.y, m, team:'home' });
      nodes.push({ x:aPt.x, y:aPt.y, m, team:'away' });
    } else {
      drawNode(hPt.x, hPt.y, '🏳️', 'TBD', 'tbd');
      drawNode(aPt.x, aPt.y, '🏳️', 'TBD', 'tbd');
    }
  });

  // TBD future rounds
  const future = [
    { r: RQF, count: 8 },
    { r: RSF, count: 4 },
    { r: RFIN + NODE_R * 1.9, count: 2 },
  ];
  future.forEach(({ r, count }) => {
    for (let i = 0; i < count; i++) {
      const offset = (N / count / 2);
      const a = ang(i * (N / count) + offset, N);
      const p = pt(r, a);
      drawNode(p.x, p.y, '', '', 'tbd');
    }
  });
}

function closeTip() {
  document.getElementById('tooltip').classList.remove('show');
}

function showTip(m) {
  const tip = document.getElementById('tooltip');
  const hn = m.home_team || '?';
  const an = m.away_team || '?';
  const hf = m.home_flag || '🏳️';
  const af = m.away_flag || '🏳️';
  document.getElementById('tip-match').textContent = `${hf} ${hn}  vs  ${an} ${af}`;
  document.getElementById('tip-detail').textContent = m.match_date || 'Fecha por confirmar';
  const res = document.getElementById('tip-result');
  if (m.home_score !== null && m.away_score !== null) {
    const winner = m.home_score > m.away_score ? hn : m.away_score > m.home_score ? an : 'Empate';
    res.textContent = `${m.home_score} — ${m.away_score} · Ganador: ${winner}`;
    res.style.display = 'block';
  } else {
    res.style.display = 'none';
  }
  tip.classList.add('show');
}

function handleClick(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  const mx = (clientX - rect.left) * (SIZE / rect.width);
  const my = (clientY - rect.top)  * (SIZE / rect.height);
  for (const n of nodes) {
    const dx = mx - n.x, dy = my - n.y;
    if (Math.sqrt(dx*dx + dy*dy) < NODE_R + 8) {
      showTip(n.m);
      return;
    }
  }
  closeTip();
}

async function init() {
  setup();

  const { data: sess } = await sb.auth.getSession();
  if (!sess?.session) {
    await sb.auth.signInWithPassword({ email: 'admin@pickbros.com', password: 'Admin2026' });
  }

  const { data, error } = await sb.from('elimination_matches')
    .select('*').eq('round','16avos').order('id');

  document.getElementById('loading').style.display = 'none';

  if (error || !data) {
    document.getElementById('loading').textContent = 'Error cargando datos';
    document.getElementById('loading').style.display = 'block';
    return;
  }

  const matches = [...data];
  while (matches.length < 16) {
    matches.push({ home_team:'Por definir', away_team:'Por definir', home_flag:'🏳️', away_flag:'🏳️', home_score:null, away_score:null });
  }

  render(matches);

  canvas.addEventListener('click', handleClick);
  canvas.addEventListener('touchend', e => { e.preventDefault(); handleClick(e); }, { passive:false });
}

init();
</script>
</body>
</html>
