  .search-bar { display:flex; gap:10px; margin-bottom:20px; }

  .search-bar button { background:#00E676; border:none; border-radius:12px; padding:12px 20px; color:#000; font-family:'DM Sans',sans-serif; font-weight:800; font-size:14px; cursor:pointer; }

  .card { background:#0d1410; border-radius:20px; padding:20px; display:none; }

  .team.right { flex-direction:row-reverse; }

  .team-flag { font-size:26px; }
  .score-center { text-align:center; }

  .pick-row.winner { background:rgba(255,200,0,0.06); border:0.5px solid rgba(255,200,0,0.2); }
  .pick-row.wrong { background:rgba(255,80,80,0.05); border:0.5px solid rgba(255,80,80,0.18); }
  .pick-row.no-pick { background:rgba(255,255,255,0.03); border:0.5px solid rgba(255,255,255,0.08); }

  .avatar { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; flex-shrink:0; }

  .no-pick .avatar { background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.3); }

  .pick-badge { font-size:10px; padding:3px 8px; border-radius:100px; font-weight:700; white-space:nowrap; }

async function loadPicks() {
  const matchId = parseInt(document.getElementById('match-input').value);
  if (!matchId || matchId < 1 || matchId > 132) {
    document.getElementById('content').innerHTML = '<div class="error">Ingresa un número de partido válido (1-72 grupos, 101+ eliminatorias)</div>';
    return;
  }

  document.getElementById('content').innerHTML = '<div class="loading">Cargando picks...</div>';
  document.getElementById('hint').style.display = 'none';

  const match = MATCHES.find(m => m.id === matchId);

  // Get all predictions for this match
  const { data: preds, error: predErr } = await sb.from('match_predictions')
    .select('user_id, home_score, away_score')
    .eq('match_id', matchId);

  if (predErr) {
    document.getElementById('content').innerHTML = `<div class="error">Error: ${predErr.message}</div>`;
    return;
  }

  // Get result if exists
  const { data: result } = await sb.from('match_results')
    .select('home_score, away_score')
    .eq('match_id', matchId)
    .maybeSingle();

  // Get all users from leaderboard for names
  const { data: users } = await sb.from('leaderboard').select('user_id, display_name');

  const userMap = {};
  if (users) users.forEach(u => { userMap[u.user_id] = u.display_name; });

  // Build picks rows
  const predMap = {};
  if (preds) preds.forEach(p => { predMap[p.user_id] = p; });

  // Get all user_ids that have picks or are in leaderboard
  const allUserIds = [...new Set([...Object.keys(predMap), ...Object.keys(userMap)])];

  const rows = allUserIds.map(uid => {
    const name = userMap[uid] || uid.split('-')[0];
    const pred = predMap[uid];
    if (!pred) return { name, pred: null, cls: 'no-pick', badge: '— Sin pick', score: '? — ?' };

    const ph = pred.home_score, pa = pred.away_score;
    let cls = 'no-pick', badge = '? Pendiente';

    if (result) {
      const rh = result.home_score, ra = result.away_score;
      if (ph === rh && pa === ra) {
        cls = 'exact'; badge = '🎯 Exacto +3pts';
      } else {
        const rw = rh > ra ? 1 : ra > rh ? -1 : 0;
        const pw = ph > pa ? 1 : pa > ph ? -1 : 0;
        cls = rw === pw ? 'winner' : 'wrong';
        badge = rw === pw ? '✓ Ganador +1pt' : '✗ Fallo +0pts';
      }
    }

    return { name, pred, cls, badge, score: `${ph} — ${pa}` };
  }).sort((a, b) => {
    const order = { exact:0, winner:1, wrong:2, 'no-pick':3 };
    return (order[a.cls]||3) - (order[b.cls]||3);
  });

  const matchName = match ? `${match.homeFlag} ${match.home} vs ${match.away} ${match.awayFlag}` : `Partido ${matchId}`;
  const matchMeta = match ? `GRUPO ${match.group} · ${match.date}` : '';
  const resultScore = result ? `${result.home_score} — ${result.away_score}` : '? — ?';
  const resultLabel = result ? 'RESULTADO FINAL' : 'EN CURSO / PENDIENTE';

  const rowsHtml = rows.map(r => `
    <div class="pick-row ${r.cls}">
      <div class="avatar">${r.name.substring(0,1).toUpperCase()}</div>
      <span class="pick-name">${r.name}</span>
      <span class="pick-score">${r.score}</span>
      <span class="pick-badge">${r.badge}</span>
    </div>
  `).join('');

  const matchBox = match ? `
    <div class="match-box">
      <div class="match-teams">
        <div class="team">
          <span class="team-flag">${match.homeFlag}</span>
          <span class="team-name">${match.home}</span>
        </div>
        <div class="score-center">
          <div class="match-meta">${matchMeta}</div>
          <div class="final-score">${resultScore}</div>
          <div class="result-label">${resultLabel}</div>
        </div>
        <div class="team right">
          <span class="team-flag">${match.awayFlag}</span>
          <span class="team-name">${match.away}</span>
        </div>
      </div>
    </div>
  ` : `<div class="match-box"><div class="score-center"><div class="final-score">${resultScore}</div></div></div>`;

  document.getElementById('content').innerHTML = `
    <div class="card visible">
      <div class="card-header">
        <div class="logo">PICK<span>BROS</span></div>
        <div class="tournament">Copa del Mundo 2026</div>
      </div>
      ${matchBox}
      <div class="section-label">Pronósticos de los participantes</div>
      <div class="picks-list">${rowsHtml}</div>
      <div class="card-footer">
        <span class="footer-url">pickbros.mx</span>
        <div class="footer-legend">
          <span style="color:rgba(0,230,118,0.7)">🎯 +3pts</span>
          <span style="color:rgba(255,200,0,0.7)">✓ +1pt</span>
          <span style="color:rgba(255,80,80,0.7)">✗ +0pts</span>
        </div>
      </div>
    </div>
  `;

  document.getElementById('hint').style.display = 'block';
}

document.getElementById('match-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') loadPicks();
});
</script>
